<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">MATERIALMIND scientific workflow</title><desc id="desc">Initial WBM crystal structures and published CHGNet predictions feed an adapted stability model, held-out calibration, development-tuned acquisition, and a reveal-only retrospective oracle. Test labels are used for evaluation after the policy is frozen. No new DFT calculations are performed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#718f7a" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="940" fill="#f8f9f5"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="65" y="69" fill="#76916f" font-family="monospace" font-size="13" letter-spacing="2.7">MATERIALMIND / SCIENTIFIC WORKFLOW</text><text x="62" y="125" fill="#233136" font-size="39" letter-spacing="-1">A decision is a hypothesis. A reference label is evidence.</text><text x="65" y="164" fill="#7e8f7e" font-size="17">Retrospective discovery on a bounded, chemical-system-held-out WBM study</text>
<g fill="#eef2e9" stroke="#d0dbcc"><rect x="65" y="218" width="345" height="180" rx="9"/><rect x="470" y="218" width="345" height="180" rx="9"/><rect x="875" y="218" width="285" height="180" rx="9"/><rect x="1220" y="218" width="315" height="180" rx="9"/></g>
<g font-family="monospace" font-size="11" fill="#8e9e88" letter-spacing="1.5"><text x="88" y="250">01 / INPUTS</text><text x="494" y="250">02 / REPRESENTATION</text><text x="900" y="250">03 / LEARNING</text><text x="1245" y="250">04 / CALIBRATION</text></g>
<g fill="#344d3a" font-size="23"><text x="88" y="288">Initial crystal structures</text><text x="494" y="288">Frozen CHGNet graph</text><text x="900" y="288">Residual ensemble</text><text x="1245" y="288">Held-out error scale</text></g>
<g fill="#7b8f75" font-size="15"><text x="88" y="321">Validate geometry and chemistry</text><text x="88" y="347">Deduplicate before outcomes</text><text x="88" y="373">Split by chemical system</text><text x="494" y="321">Initial-structure embeddings</text><text x="494" y="347">Published relaxed energy prior</text><text x="494" y="373">Fixed composition hull reference</text><text x="900" y="321">Fit only training labels</text><text x="900" y="347">Adapt the stability prior</text><text x="900" y="373">Refit after selected reveals</text><text x="1245" y="321">Nominal 90% conformal interval</text><text x="1245" y="347">Empirical stability probability</text><text x="1245" y="373">Measure coverage under shift</text></g>
<g fill="none" stroke="#718f7a" stroke-width="1.8" marker-end="url(#arrow)"><path d="M410 308H453"/><path d="M815 308H858"/><path d="M1160 308H1204"/><path d="M1377 398V449H1060V491"/></g>
<rect x="875" y="510" width="660" height="160" rx="9" fill="#14252b"/><g fill="#cbe1d2"><text x="901" y="544" font-family="monospace" font-size="11" letter-spacing="1.5">05 / FITTED ACQUISITION</text><text x="901" y="584" font-size="25">Expected stability + exploration + diversity</text><text x="901" y="619" font-size="17" fill="#99b4a6">Divide by relative cost to a development-tuned exponent.</text><text x="901" y="646" font-size="15" fill="#799a8b">Freeze coefficients before running held-out campaigns.</text></g>
<rect x="65" y="510" width="345" height="160" rx="9" fill="#efe7d9" stroke="#ddceba"/><g fill="#8a7053"><text x="88" y="544" font-family="monospace" font-size="11" letter-spacing="1.5">REFERENCE OUTCOMES</text><text x="88" y="582" font-size="24">Previously computed DFT</text><text x="88" y="616" font-size="15">Signed distance to a fixed MP hull</text><text x="88" y="643" font-size="15">Stable ≤ 0 eV / atom</text></g>
<rect x="470" y="510" width="345" height="160" rx="9" fill="#f8f9f5" stroke="#aabb9d" stroke-dasharray="6 5" stroke-width="1.5"/><g fill="#5e7955"><text x="494" y="544" font-family="monospace" font-size="11" letter-spacing="1.5">06 / REVEAL BOUNDARY</text><text x="494" y="582" font-size="24">Select IDs, then query</text><text x="494" y="616" font-size="15">Log chosen labels and proxy cost</text><text x="494" y="643" font-size="15">Never fit unrevealed pool outcomes</text></g>
<g fill="none" stroke="#718f7a" stroke-width="1.8" marker-end="url(#arrow)"><path d="M875 589H832"/><path d="M410 589H453"/><path d="M640 510V450H1018V415"/><path d="M642 670V733"/></g>
<text x="751" y="441" fill="#7c9273" font-family="monospace" font-size="11">SELECTED OUTCOMES → ONLINE UPDATE</text>
<rect x="65" y="750" width="1470" height="115" rx="9" fill="#edf2e7" stroke="#d0dbcc"/><g fill="#5e7955"><text x="88" y="786" font-family="monospace" font-size="11" letter-spacing="1.5">07 / ANALYSIS AFTER POLICY FREEZE</text><text x="88" y="825" font-size="21">Paired multi-seed baselines · Discovery yield · Cost budgets · Calibration · Diversity · Regret · Reproducible records</text></g>
<text x="65" y="910" fill="#8a9b80" font-size="13">Retrospective reference evaluation, not new DFT or synthesis. Chemical-system holdout does not remove pretrained prototype overlap.</text>
</g></svg>
