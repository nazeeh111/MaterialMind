<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">MATERIALMIND software architecture</title><desc id="desc">The Python package provides validation, learning, acquisition and experiments to a CLI and loopback FastAPI server. The browser renders local crystal data. DFT reference labels are isolated from the static web directory and queried by candidate ID. Saved benchmark artifacts carry metrics, predictions, policy and provenance.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#728e79" stroke-width="1.5"/></marker></defs><rect width="1440" height="700" fill="#f8f9f5"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="58" y="52" font-family="monospace" font-size="12" letter-spacing="2" fill="#76916f">MATERIALMIND / SOFTWARE ARCHITECTURE</text><text x="55" y="103" font-size="35" fill="#233136" letter-spacing="-.9">One scientific engine. Every decision traceable.</text>
<rect x="55" y="155" width="345" height="158" rx="8" fill="#14252b"/><rect x="55" y="385" width="345" height="120" rx="8" fill="#e9eee3" stroke="#d0dbcc"/>
<g fill="#cbe1d2"><text x="80" y="189" font-size="11" font-family="monospace" letter-spacing="1">BROWSER / LOCAL ASSETS</text><text x="80" y="231" font-size="24">MATERIALMIND LAB</text><text x="80" y="263" font-size="15">Three.js crystal rendering</text><text x="80" y="287" font-size="15">Rank · inspect · reveal · export</text></g>
<g fill="#5e7955"><text x="80" y="421" font-size="11" font-family="monospace" letter-spacing="1">COMMAND LINE</text><text x="80" y="460" font-size="22">serve · benchmark · inspect</text><text x="80" y="487" font-size="14">CPU demonstration and reproducibility</text></g>
<rect x="480" y="155" width="470" height="350" rx="8" fill="#eef2e9" stroke="#cbd9c7"/><g fill="#344d3a"><text x="505" y="189" font-size="11" font-family="monospace" letter-spacing="1">PYTHON PACKAGE / materialmind</text><text x="505" y="231" font-size="25">FastAPI session + scientific engine</text><text x="505" y="271" font-size="16">structures.py · validation, symmetry, CIF</text><text x="505" y="310" font-size="16">learning.py · residual fit and calibration</text><text x="505" y="349" font-size="16">acquisition.py · scoring and oracle boundary</text><text x="505" y="388" font-size="16">benchmark.py · fit policy and paired campaigns</text><text x="505" y="447" font-size="14" fill="#7a9072">Loopback server · per-session reveals</text><text x="505" y="474" font-size="14" fill="#7a9072">No paid API or external service required</text></g>
